# ===========================
# Application Configuration
# ===========================
spring.application.name=distributed-job-platform

# ===========================
# PostgreSQL
# ===========================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jobplatform}
spring.datasource.username=${DATABASE_USERNAME:postgres}
# Password must be provided via the DATABASE_PASSWORD environment variable.
# See .env.example for the Docker Compose setup. There is intentionally no
# default value in this file so the application refuses to start with weak
# hard-coded credentials in any environment that does not supply one.
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================
# Redis
# ===========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000

# ===========================
# Kafka
# ===========================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=job-platform-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ===========================
# JWT Configuration
# ===========================
# Base64-encoded HMAC-SHA256 key (>= 256 bits). Must be provided via the
# JWT_SECRET environment variable. See .env.example for the Docker Compose setup.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.token-prefix=Bearer

# ===========================
# Initial Admin / Demo User (must be overridden via env in any real deployment)
# This startup initializer is the ONLY mechanism that creates ADMIN accounts.
# Public /api/auth/register ALWAYS creates USER accounts regardless of input.
# Admin/demo passwords have no default value in this file and must be provided
# via the ADMIN_PASSWORD / DEMO_USER_PASSWORD environment variables.
# ===========================
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}
app.demo-user.enabled=${DEMO_USER_ENABLED:true}
app.demo-user.username=${DEMO_USER_USERNAME:user}
app.demo-user.password=${DEMO_USER_PASSWORD}

# H2 console disabled (H2 is test-only; the console must never be exposed in deployment)
spring.h2.console.enabled=false

# ===========================
# Rate Limiting (Redis)
# ===========================
app.rate-limit.requests-per-minute=100
app.rate-limit.fail-open=true

# ===========================
# Worker Pool
# ===========================
app.worker.pool-size=5
app.worker.queue-capacity=100

# ===========================
# Scheduler
# ===========================
app.scheduler.interval-seconds=5
app.scheduler.batch-size=50

# ===========================
# Actuator
# ===========================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

# ===========================
# Server
# ===========================
server.port=8080
