# Test configuration - uses H2, disables Redis and Kafka
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Redis for tests
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Disable Kafka for tests
spring.kafka.bootstrap-servers=localhost:9092

# JWT test secret (must be at least 256 bits for HMAC-SHA256)
app.jwt.secret=YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwYWJjZGVmZmhpamtsbW5vcA==
app.jwt.expiration-ms=86400000
app.jwt.token-prefix=Bearer

# Rate limit test config
app.rate-limit.requests-per-minute=100
app.rate-limit.fail-open=true

# Worker pool test config
app.worker.pool-size=5
app.worker.queue-capacity=100

# Scheduler test config
app.scheduler.interval-seconds=5
app.scheduler.batch-size=50

# Disable health checks for unavailable services
management.health.redis.enabled=false
management.health.kafka.enabled=false

# Server
server.port=0
